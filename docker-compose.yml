services:
  arabic-tts:
    build: .
    image: arabic-tts:latest
    container_name: arabic-tts
    ports:
      - "7860:7860"
    volumes:
      - ./data:/workspace/data
      - ./runs:/workspace/runs
      - ./cache:/workspace/.cache
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - COQUI_TOS_AGREED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Override with e.g. `docker compose run --rm arabic-tts arabic-tts train ...`
    command: ["arabic-tts", "serve", "--host", "0.0.0.0", "--port", "7860"]
